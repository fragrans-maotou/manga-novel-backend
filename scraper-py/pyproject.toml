[project]
name = "manga-novel-scraper"
version = "0.1.0"
description = "Async scrape worker for manga-novel-backend (SPEC §2 / §5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.2.0",
  "curl_cffi>=0.9.0",
  "lxml>=5.3.0",
  "cssselect>=1.2.0",
  "quickjs>=1.19.4",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
scraper-cli = "app.cli:main"
scraper-worker = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/rules/demo_novel.json" = "app/rules/demo_novel.json"
"app/rules/demo_manga_js.json" = "app/rules/demo_manga_js.json"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
